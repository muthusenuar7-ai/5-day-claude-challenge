<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5-Day Claude Challenge</title>
<style>
  /* ---------- Palette: #1A120E #3A2418 #6B4A2E #A88462 #D5C4AE #4A4A46 ---------- */
  :root[data-theme="dark"]{
    --bg:#3A2418;
    --g1:#432b1d; --g2:#351f14;
    --sh-d:#1A120E;
    --sh-l:#5b3d2a;
    --text:#D5C4AE;
    --muted:#A88462;
    --accent:#A88462;
    --accent-grad:linear-gradient(145deg,#c3a37d,#A88462 55%,#8b6a47);
    --on-accent:#1A120E;
    --ok:#8DAA7F;
    --glow:rgba(168,132,98,.22);
    --code-bg:#351f14;
  }
  :root[data-theme="light"]{
    --bg:#D5C4AE;
    --g1:#dccdb9; --g2:#cbb9a1;
    --sh-d:#ac9a82;
    --sh-l:#f3e9d9;
    --text:#1A120E;
    --muted:#6B4A2E;
    --accent:#6B4A2E;
    --accent-grad:linear-gradient(145deg,#85603d,#6B4A2E 55%,#563820);
    --on-accent:#F6ECDD;
    --ok:#5f8a52;
    --glow:rgba(107,74,46,.18);
    --code-bg:#cbb9a1;
  }
  :root{
    --raised:9px 9px 20px var(--sh-d),-9px -9px 20px var(--sh-l);
    --raised-sm:5px 5px 11px var(--sh-d),-5px -5px 11px var(--sh-l);
    --inset:inset 6px 6px 13px var(--sh-d),inset -6px -6px 13px var(--sh-l);
    --inset-sm:inset 3px 3px 7px var(--sh-d),inset -3px -3px 7px var(--sh-l);
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;
    background:var(--bg);color:var(--text);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    transition:background .5s,color .5s;
  }
  .app{display:grid;grid-template-columns:310px 1fr;gap:28px;padding:22px;min-height:100vh}

  /* ---------- Sidebar ---------- */
  aside{
    position:sticky;top:22px;height:calc(100vh - 44px);overflow:auto;
    padding:28px 22px;border-radius:30px;
    background:linear-gradient(145deg,var(--g1),var(--g2));
    box-shadow:var(--raised);
    display:flex;flex-direction:column;
  }
  .logo{background:#fff;border-radius:18px;padding:8px 12px;margin-bottom:20px;box-shadow:var(--raised-sm)}
  .logo img{display:block;width:100%;height:auto}
  .brand{font-weight:800;font-size:19px;letter-spacing:.02em;text-transform:uppercase;line-height:1.25}
  .brand span{color:var(--accent)}
  .overall{margin:20px 0 26px}
  .overall p{margin:0 0 12px;color:var(--muted);font-size:13px;font-weight:600}
  .bar{height:14px;border-radius:99px;box-shadow:var(--inset-sm);padding:3px}
  .bar>i{
    display:block;height:100%;width:0;border-radius:99px;
    background:var(--accent-grad);
    transition:width .7s var(--ease);
  }
  nav{flex:1}
  .day-btn{
    width:100%;display:flex;gap:14px;align-items:center;
    padding:12px 14px;margin-bottom:14px;border:none;border-radius:18px;
    background:linear-gradient(145deg,var(--g1),var(--g2));
    box-shadow:var(--raised-sm);color:var(--text);
    cursor:pointer;text-align:left;font:inherit;
    transition:box-shadow .3s var(--ease),transform .3s var(--ease);
  }
  .day-btn:hover{transform:translateY(-2px)}
  .day-btn.active{box-shadow:var(--inset-sm);background:var(--bg);transform:none}
  .num{
    width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;
    font-weight:800;color:var(--muted);
    box-shadow:var(--inset-sm);transition:.3s;
  }
  .day-btn.active .num{background:var(--accent-grad);color:var(--on-accent);box-shadow:var(--raised-sm)}
  .day-btn.done .num{background:var(--ok);color:#1A120E;box-shadow:var(--raised-sm)}
  .dmeta strong{display:block;font-size:14.5px}
  .dmeta small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
  .theme-btn{margin-top:10px;width:100%}

  /* ---------- Buttons ---------- */
  .btn{
    border:none;text-decoration:none;display:inline-block;font:inherit;font-weight:700;font-size:13px;cursor:pointer;
    padding:11px 20px;border-radius:14px;color:var(--text);
    background:linear-gradient(145deg,var(--g1),var(--g2));
    box-shadow:var(--raised-sm);
    transition:box-shadow .2s,transform .2s,color .2s;
  }
  .btn:hover:not(:disabled){transform:translateY(-2px);color:var(--accent)}
  .btn:active:not(:disabled){box-shadow:var(--inset-sm);transform:none}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--accent-grad);color:var(--on-accent)}
  .btn.primary:hover:not(:disabled){color:var(--on-accent);filter:brightness(1.08)}

  /* ---------- Main ---------- */
  main{padding:10px clamp(4px,2vw,24px) 40px;max-width:1040px;width:100%}
  .hero{
    position:relative;overflow:hidden;
    display:flex;gap:30px;align-items:center;flex-wrap:wrap;
    padding:34px;border-radius:34px;
    background:linear-gradient(145deg,var(--g1),var(--g2));
    box-shadow:var(--raised);
  }
  .hero::before{
    content:"";position:absolute;width:380px;height:380px;right:-120px;top:-160px;border-radius:50%;
    background:radial-gradient(circle,var(--glow),transparent 65%);
    animation:float 9s ease-in-out infinite;
  }
  @keyframes float{50%{transform:translate(-30px,30px) scale(1.12)}}
  .ring{
    position:relative;width:128px;height:128px;border-radius:50%;flex:none;
    display:grid;place-items:center;box-shadow:var(--inset);
  }
  .ring::after{
    content:"";position:absolute;inset:14px;border-radius:50%;
    box-shadow:var(--raised-sm);background:linear-gradient(145deg,var(--g1),var(--g2));
    animation:pulse 4s ease-in-out infinite;
  }
  .ring b{position:relative;z-index:1;font-size:44px;font-weight:800;color:var(--accent)}
  @keyframes pulse{50%{transform:scale(.94)}}
  .hero-text{position:relative;flex:1;min-width:260px}
  .eyebrow{text-transform:uppercase;letter-spacing:.35em;font-size:12px;color:var(--muted);font-weight:700}
  h1{
    font-size:clamp(30px,5vw,50px);margin:8px 0 10px;
    text-transform:uppercase;letter-spacing:-.01em;font-weight:900;line-height:1.05;
  }
  .lead{color:var(--text);opacity:.85;font-size:17px;line-height:1.6;margin:0;max-width:640px}
  .chips{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
  .chip{font-size:13px;font-weight:600;padding:8px 14px;border-radius:99px;box-shadow:var(--inset-sm)}

  section{margin-top:40px}
  h2{font-size:15px;margin:0 0 20px;text-transform:uppercase;letter-spacing:.25em;color:var(--muted);font-weight:800}
  .grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
  .card{
    padding:22px;border-radius:26px;
    background:linear-gradient(145deg,var(--g1),var(--g2));
    box-shadow:var(--raised);
    transition:transform .3s var(--ease);
  }
  .card:hover{transform:translateY(-4px)}
  .card h3{margin:0 0 14px;font-size:16px}
  .prompt{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.2px;line-height:1.65;
    padding:16px;border-radius:16px;margin:0 0 16px;white-space:pre-wrap;
    background:var(--bg);box-shadow:var(--inset);color:var(--text);
  }
  .muted{color:var(--muted);font-size:14px;margin:6px 0 0}
  .ds{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}

  /* ---------- Checklist ---------- */
  .task{
    display:flex;gap:16px;align-items:center;padding:16px 18px;margin-bottom:18px;
    border-radius:20px;cursor:pointer;
    background:linear-gradient(145deg,var(--g1),var(--g2));
    box-shadow:var(--raised-sm);transition:box-shadow .3s,transform .3s var(--ease);
  }
  .task:hover{transform:translateY(-2px)}
  .task input{position:absolute;opacity:0;pointer-events:none}
  .box{
    width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;
    box-shadow:var(--inset-sm);transition:.3s var(--ease);
    font-size:16px;font-weight:900;color:transparent;
  }
  .task input:checked + .box{background:var(--accent-grad);color:var(--on-accent);box-shadow:var(--raised-sm)}
  .task input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:3px}
  .task.checked{box-shadow:var(--inset-sm);background:var(--bg)}
  .task.checked .txt{text-decoration:line-through;opacity:.55}

  .footer-nav{display:flex;justify-content:space-between;margin-top:46px;gap:12px}

  .toast{
    position:fixed;bottom:26px;left:50%;transform:translate(-50%,160px);z-index:10;
    padding:14px 22px;border-radius:18px;font-weight:700;
    background:linear-gradient(145deg,var(--g1),var(--g2));box-shadow:var(--raised);
    transition:transform .5s cubic-bezier(.2,.9,.3,1.2);
  }
  .toast.show{transform:translate(-50%,0)}
  .confetti{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;z-index:20;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
  .fade{animation:fadeUp .55s var(--ease) both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  @media (max-width:880px){
    .app{grid-template-columns:1fr;padding:14px}
    aside{position:static;height:auto}
    .hero{padding:24px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><img src="logo.jpg" alt="Datacense"></div>
    <div class="brand">5-Day <span>Claude</span><br>Challenge</div>
    <div class="overall">
      <p id="overall-text">0% complete</p>
      <div class="bar"><i id="overall-bar"></i></div>
    </div>
    <nav id="nav"></nav>
    <button class="btn theme-btn" id="theme-btn" type="button"></button>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
</script>
<script src="content.js"></script>
<script>
/* ============================================================
   APP LOGIC
   ============================================================ */
const DAYS = CHALLENGE.days;
const STORE_KEY = "claude-5day-progress-v1";
const THEME_KEY = "claude-5day-theme";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let progress;
try { progress = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { progress = {}; }
progress.tasks = progress.tasks || {};
let current = Number.isInteger(progress.lastDay) && progress.lastDay >= 0 && progress.lastDay < DAYS.length ? progress.lastDay : 0;

const isDone = (dayId, k) => !!progress.tasks[`${dayId}-${k}`];
const dayDone = d => d.tasks.filter((_, k) => isDone(d.id, k)).length;
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) {} };

/* ---------- Theme ---------- */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $("#theme-btn").textContent = t === "dark" ? "☀  Switch to Light" : "🌙  Switch to Dark";
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
}
let savedTheme = "dark";
try { savedTheme = localStorage.getItem(THEME_KEY) || "dark"; } catch (e) {}
applyTheme(savedTheme === "light" ? "light" : "dark");
$("#theme-btn").addEventListener("click", () =>
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

/* ---------- Rendering ---------- */
function renderNav() {
  $("#nav").innerHTML = DAYS.map((d, i) => {
    const done = dayDone(d), total = d.tasks.length;
    const cls = [i === current ? "active" : "", done === total && total ? "done" : ""].join(" ");
    return `<button class="day-btn ${cls}" data-day="${i}" type="button">
      <span class="num">${done === total && total ? "✓" : d.id}</span>
      <span class="dmeta"><strong>Day ${d.id}: ${esc(d.title)}</strong><small>${done}/${total} tasks</small></span>
    </button>`;
  }).join("");
}

function updateOverall() {
  const total = DAYS.reduce((a, d) => a + d.tasks.length, 0);
  const done = DAYS.reduce((a, d) => a + dayDone(d), 0);
  const pct = total ? Math.round(done / total * 100) : 0;
  $("#overall-text").textContent = `${pct}% complete · ${done}/${total} tasks`;
  $("#overall-bar").style.width = pct + "%";
}

function renderDay(i) {
  const d = DAYS[i];
  const total = d.tasks.length, done = dayDone(d);
  $("#main").innerHTML = `
  <div class="fade">
    <div class="hero">
      <div class="ring"><b>${d.id}</b></div>
      <div class="hero-text">
        <div class="eyebrow">Day ${d.id} of ${DAYS.length}</div>
        <h1>${esc(d.title)}</h1>
        <p class="lead">${esc(d.goal)}</p>
        <div class="chips">
          <span class="chip">⏱ ${esc(d.duration)}</span>
          <span class="chip" id="task-count">✅ ${done}/${total} tasks</span>
          <span class="chip">🧩 ${d.prompts.length} prompts</span>
          ${d.datasets.length ? `<span class="chip">📊 ${d.datasets.length} dataset${d.datasets.length>1?"s":""}</span>` : ""}
        </div>
      </div>
    </div>

    <section>
      <h2>Objective</h2>
      <p class="lead" style="font-size:16px">${esc(d.objective)}</p>
    </section>

    <section>
      <h2>Prompts to try</h2>
      <div class="grid">
        ${d.prompts.map((p, k) => `
          <div class="card fade" style="animation-delay:${k * 90}ms">
            <h3>${esc(p.title)}</h3>
            <pre class="prompt">${esc(p.text)}</pre>
            <button class="btn" data-copy="${k}" type="button">Copy prompt</button>
          </div>`).join("")}
      </div>
    </section>

    ${d.datasets.length ? `
    <section>
      <h2>Dataset</h2>
      <div class="grid">
        ${d.datasets.map((ds, k) => `
          <div class="card fade">
            <div class="ds">
              <div>
                <h3 style="margin-bottom:0">${esc(ds.name)}</h3>
                <p class="muted">${esc(ds.description)}</p>
              </div>
              <a class="btn primary" href="${esc(ds.file)}" download="${esc(ds.name)}" data-dl="${k}">Download CSV</a>
            </div>
          </div>`).join("")}
      </div>
    </section>` : ""}

    <section>
      <h2>Checklist</h2>
      ${d.tasks.map((t, k) => `
        <label class="task ${isDone(d.id, k) ? "checked" : ""}">
          <input type="checkbox" data-task="${k}" ${isDone(d.id, k) ? "checked" : ""}>
          <span class="box">✓</span>
          <span class="txt">${esc(t)}</span>
        </label>`).join("")}
    </section>

    <div class="footer-nav">
      <button class="btn" data-go="${i - 1}" type="button" ${i === 0 ? "disabled" : ""}>← Previous</button>
      <button class="btn primary" data-go="${i + 1}" type="button" ${i === DAYS.length - 1 ? "disabled" : ""}>Next day →</button>
    </div>
  </div>`;
  updateOverall();
}

function go(i) {
  if (i < 0 || i >= DAYS.length) return;
  current = i;
  progress.lastDay = i;
  save();
  renderNav();
  renderDay(i);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function copyText(text, btn) {
  const done = () => { btn.textContent = "Copied ✓"; setTimeout(() => (btn.textContent = "Copy prompt"), 1600); };
  const fallback = () => {
    const t = document.createElement("textarea");
    t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); done(); } catch (e) { showToast("Copy failed — select the text manually"); }
    t.remove();
  };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(fallback);
  else fallback();
}

let toastTimer;
function showToast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}

function burst() {
  const colors = ["#A88462", "#D5C4AE", "#6B4A2E", "#8DAA7F", "#E8D9C0"];
  for (let n = 0; n < 90; n++) {
    const c = document.createElement("span");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[n % colors.length];
    c.style.animationDuration = (1.8 + Math.random() * 1.6) + "s";
    c.style.animationDelay = Math.random() * 0.4 + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4200);
  }
}

/* ---------- Events ---------- */
$("#nav").addEventListener("click", e => {
  const btn = e.target.closest("[data-day]");
  if (btn) go(+btn.dataset.day);
});

$("#main").addEventListener("click", e => {
  const copy = e.target.closest("[data-copy]");
  if (copy) { copyText(DAYS[current].prompts[+copy.dataset.copy].text, copy); return; }
  const dl = e.target.closest("[data-dl]");
  if (dl) {
    showToast(`Downloading ${DAYS[current].datasets[+dl.dataset.dl].name}`);
    return;
  }
  const nav = e.target.closest("[data-go]");
  if (nav && !nav.disabled) go(+nav.dataset.go);
});

$("#main").addEventListener("change", e => {
  const cb = e.target.closest("[data-task]");
  if (!cb) return;
  const d = DAYS[current];
  const key = `${d.id}-${+cb.dataset.task}`;
  if (cb.checked) progress.tasks[key] = true; else delete progress.tasks[key];
  save();

  cb.closest(".task").classList.toggle("checked", cb.checked);
  const done = dayDone(d);
  const countEl = $("#task-count");
  if (countEl) countEl.textContent = `✅ ${done}/${d.tasks.length} tasks`;
  renderNav();
  updateOverall();

  if (cb.checked && done === d.tasks.length) {
    burst();
    showToast(current === DAYS.length - 1 ? "🎉 Challenge complete!" : `🎉 Day ${d.id} complete — on to Day ${d.id + 1}!`);
  }
});

document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  if (e.key === "ArrowRight") go(current + 1);
  if (e.key === "ArrowLeft") go(current - 1);
});

renderNav();
renderDay(current);
</script>
</body>
</html>
